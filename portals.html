<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Vendor Portals — Azemi</title>
<style>
  :root {
    color-scheme: light dark;
    --ground:#FBF8F4; --panel:#FFFFFF; --edge:#E7DDD2;
    --ink:#2A1A1E; --ink2:#6A5A5C; --brand:#5C1F2E; --bad:#9B2C2C;
  }
  @media (prefers-color-scheme: dark) { :root {
    --ground:#171113; --panel:#201719; --edge:#362A2D;
    --ink:#F2E9E7; --ink2:#BCA9AC; --brand:#E4A9B4; --bad:#E08A8A; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--ground); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--edge);
    border-radius:10px; padding:26px 24px; }
  .eyebrow { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--brand);
    font-weight:700; margin:0 0 8px; }
  h1 { font-family:"Optima","Palatino",Georgia,serif; font-weight:400; font-size:24px; margin:0 0 6px; }
  p { margin:0 0 18px; color:var(--ink2); font-size:14px; line-height:1.5; }
  label { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink2); font-weight:700; margin-bottom:6px; }
  input[type=password] { width:100%; font-size:16px; padding:11px 13px; border-radius:6px;
    border:1px solid var(--edge); background:var(--ground); color:var(--ink); font-family:inherit; }
  input[type=password]:focus-visible, button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .row { display:flex; align-items:center; gap:8px; margin:14px 0 18px; }
  .row label { text-transform:none; letter-spacing:0; font-size:13px; font-weight:400;
    color:var(--ink2); margin:0; }
  button { width:100%; font-size:15px; font-weight:600; font-family:inherit; padding:12px;
    border:none; border-radius:6px; background:var(--brand); color:var(--ground); cursor:pointer; }
  button[disabled] { opacity:.6; cursor:progress; }
  .err { color:var(--bad); font-size:13px; margin-top:12px; min-height:18px; }
</style>
</head>

    </div>
    <button type="submit" id="go">Unlock</button>

</main>

const KEY_NAME = "azemi_pw_portals";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}

function render(html) {
  // document.write is what makes the decrypted page's own <script> tags run --
  // innerHTML would drop them, and the page needs its scripts for saved checkboxes.
  document.open(); document.write(html); document.close();
}

const form = document.getElementById("f"), err = document.getElementById("err"),
      go = document.getElementById("go"), pw = document.getElementById("pw");

form.addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = ""; go.disabled = true; go.textContent = "Unlocking...";
  try {
    const html = await unlock(pw.value);
    if (document.getElementById("save").checked) {
      try { localStorage.setItem(KEY_NAME, pw.value); } catch (_) {}
    }
    render(html);
  } catch (_) {
    err.textContent = "That passphrase didn't work. Check for typos or extra spaces.";
    go.disabled = false; go.textContent = "Unlock";
    pw.select();
  }
});

// Already unlocked on this device? Go straight in.
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_NAME); } catch (_) {}
  if (!saved) return;
  try { render(await unlock(saved)); }
  catch (_) { try { localStorage.removeItem(KEY_NAME); } catch (_) {} }
})();
</script>
